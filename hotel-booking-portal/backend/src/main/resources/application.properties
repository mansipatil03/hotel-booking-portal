spring.application.name=hotel-booking
# Credentials come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/hotel_booking?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# schema.sql + data.sql are idempotent and run on every start
spring.sql.init.mode=always
